<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" height="200" viewBox="0 0 200 200" width="200">
  <style>.c{animation:sp 2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style>
  
  <rect class="c" fill="#f00" height="20" width="20" x="10" y="10"/>
  <circle cx="100" cy="100" fill="#00f" r="30">
    <animate attributeName="r" dur="2s" repeatCount="indefinite" values="30;40;30"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" dur="3s" from="0 100 100" repeatCount="indefinite" to="360 100 100" type="rotate"/>
    <rect fill="#0a0" height="20" width="20" x="150" y="90"/>
  </g>
  <linearGradient id="g">
    <stop offset="0" stop-color="#fff"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <rect fill="url(#g)" height="10" width="180" x="10" y="150"/>
  <image height="40" href="/github/explore/main/topics/github/github.png" width="40" x="50" y="50"/>
</svg>