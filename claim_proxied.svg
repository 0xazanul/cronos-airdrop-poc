<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="&apos;Helvetica Neue&apos;, Arial, sans-serif" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1440 900" width="100%">
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" id="bg" x1="0" x2="0" y1="0" y2="900">
